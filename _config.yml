description: >-
  William R. Hauk, Jr. is an Associate Professor of Economics at the Darla Moore
  School of Business, University of South Carolina. Research on international
  trade, economic growth, political economics, and the intersection of Catholic
  social thought and economics.

url:     "https://www.haukeconomics.com"
baseurl: ""
lang:    "en_US"

author:
  name:  "William R. Hauk, Jr."
  email: "hauk@moore.sc.edu"

contact:
  email:    "hauk@moore.sc.edu"
  phone:    "+1-803-777-6044"
  office:   "Room 301M"
  building: "Darla Moore School of Business"
  street:   "1014 Greene St."
  locality: "Columbia"
  region:   "SC"
  postal:   "29208"
  country:  "U.S.A."

# Feeds the `sameAs` array in the structured data search engines read.
# jekyll-seo-tag cannot read _data files, so keep this in sync with
# _data/profiles.yml by hand. It is only a few lines.
social:
  name: "William R. Hauk, Jr."
  links:
    - "https://scholar.google.com/citations?user=B744wv0AAAAJ"
    - "https://ideas.repec.org/f/pha466.html"
    - "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=1729950"
    - "https://www.researchgate.net/profile/William-Hauk"
    - "https://sc.academia.edu/WilliamHauk"
    - "https://github.com/BillHauk"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
# Replaces `markdown: CommonMarkGhPages`, which GitHub deprecated and may stop
# supporting without notice. kramdown is the only engine GitHub Pages supports.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false      # a single newline is a space, not a <br>, so abstracts
                        # in _data may be wrapped for readability
  auto_ids: true
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

# All four are on the GitHub Pages plugin whitelist, so the site keeps building
# natively with no GitHub Actions workflow to maintain.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Applies to blog posts only; the standalone pages set their own `permalink`.
permalink: /blog/:year/:month/:day/:title/

timezone: America/New_York

feed:
  path: feed.xml

defaults:
  - scope: { path: "" }
    values:
      image: "/assets/img/og-card.png"
  - scope: { path: "", type: "posts" }
    values:
      layout: "post"
      nav: "blog"

# NOTE: never add CNAME here — it is what points www.haukeconomics.com at this repo.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.md
  - tools
  - vendor
  - .jekyll-cache
