---
layout: default
---
<div class="wrap">
  <header class="page-header">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-header__title">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="page-header__sub">{{ page.subtitle }}</p>{% endif %}
  </header>

  {{ content }}
</div>
