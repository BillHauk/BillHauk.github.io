<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="H">
  <title>William R. Hauk, Jr.</title>
  <rect width="64" height="64" fill="#73000A"/>
  <!--
    The H is drawn as paths rather than <text> so it does not depend on Georgia
    being installed wherever the icon is rendered. Serif stems with slab-ish
    brackets, matching the site's Georgia headings.
  -->
  <g fill="#FFFCF8">
    <rect x="14" y="17" width="7" height="30"/>
    <rect x="43" y="17" width="7" height="30"/>
    <rect x="21" y="29" width="22" height="6"/>
    <rect x="10" y="17" width="15" height="3"/>
    <rect x="10" y="44" width="15" height="3"/>
    <rect x="39" y="17" width="15" height="3"/>
    <rect x="39" y="44" width="15" height="3"/>
  </g>
</svg>
